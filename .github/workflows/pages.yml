name: Publish site

# Publishes the site whenever main changes (Pages source is set to "GitHub Actions").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish
        id: first
        # If another publish is in progress, wait and retry instead of failing.
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait for the other publish to finish
        if: ${{ steps.first.outcome == 'failure' }}
        run: sleep 75
      - name: Publish (retry)
        if: ${{ steps.first.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
