name: Publish site

# Publishes the site whenever main changes (needed once Pages is set to
# "GitHub Actions" as its source). The election workflow also publishes every run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish
        id: first
        # The 5-minute results job also publishes; if it's mid-publish, wait and retry
        # instead of failing (and emailing) on the collision.
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait for the other publish to finish
        if: ${{ steps.first.outcome == 'failure' }}
        run: sleep 75
      - name: Publish (retry)
        if: ${{ steps.first.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
