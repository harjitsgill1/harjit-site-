name: Election results

# Pull results, commit real changes, and republish the site.
# Each run starts the next one itself (GitHub's cron is often late or skipped),
# so updates keep flowing; the cron below only restarts the chain if it breaks.
# Cadence: ~2.5 min on election night (Nov 3-6), ~7 min before, ~15 min after.
# Publishing from this workflow (Settings > Pages > Source: GitHub Actions)
# avoids the 10-builds-per-hour limit on branch-based Pages builds.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Accept feed data before polls close (testing only, no commit or publish)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: election-results
  cancel-in-progress: false

jobs:
  # Tracker season ends one week after Election Day (midnight PT, Nov 10-11);
  # after that every run (including the backup schedule) stops here quietly.
  season:
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.check.outputs.open }}
    steps:
      - id: check
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d '2026-11-11T08:00:00Z' +%s)" ]; then echo "open=true" >> "$GITHUB_OUTPUT"; else echo "Tracker season is over."; fi
  update:
    needs: season
    if: ${{ needs.season.outputs.open == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install browser driver (uses the runner's preinstalled Chrome)
        run: |
          cd scripts/election
          npm i --no-save --no-package-lock --silent playwright@1
          which google-chrome || npx playwright install --with-deps chromium > /dev/null
          which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null)
      - name: Pull latest results
        id: pull
        run: node scripts/election/update.mjs
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
      - name: Commit real changes
        if: ${{ !inputs.force && steps.pull.outputs.changed == 'true' }}
        run: |
          git config user.name "election-bot"
          git config user.email "election-bot@users.noreply.github.com"
          git add election/data/results.json election/data/rehearsal.json
          git commit -m "Update election results" || exit 0
          if ! git pull --rebase origin main; then
            git rebase --abort
            echo "::warning::Could not rebase; this run's numbers are still published."
            exit 0
          fi
          git push || echo "::warning::Push failed; this run's numbers are still published."
      - name: Remove build-only files
        if: ${{ !inputs.force }}
        run: rm -rf scripts/election/node_modules
      - name: Package site
        if: ${{ !inputs.force }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish site
        id: publish
        if: ${{ !inputs.force }}
        # Fails until Settings > Pages > Source is "GitHub Actions"; meanwhile the
        # committed results still go out through the branch build.
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Flag publish failure
        if: ${{ !inputs.force && steps.publish.outcome == 'failure' }}
        run: echo "::warning title=Publish failed::Site not republished this run. Set Settings > Pages > Source to GitHub Actions."
      - name: Start the next run
        # Every run (test runs too) starts the next, so the chain can't be broken by
        # GitHub dropping a queued run; duplicates collapse to one queued run.
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          night_start=$(date -u -d '2026-11-03T20:00:00Z' +%s)
          night_end=$(date -u -d '2026-11-07T08:00:00Z' +%s)
          stop=$(date -u -d '2026-11-11T08:00:00Z' +%s)
          if [ "$now" -ge "$stop" ]; then echo "Tracker season over; not chaining."; exit 0; fi
          if [ "$now" -ge "$night_start" ] && [ "$now" -lt "$night_end" ]; then wait=20
          elif [ "$now" -lt "$night_start" ]; then wait=240
          else wait=720; fi
          sleep $wait
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/election-results.yml/dispatches" \
            -d '{"ref":"main"}' -w "dispatch HTTP %{http_code}\n"
